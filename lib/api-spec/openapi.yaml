            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: to
          in: query
          required: false
          description: Date YYYY-MM-DD
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Per-site plan/fact rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MySiteSummary"

  /trade-names:
    get:
      operationId: listTradeNames
      tags: [tradeNames]
      summary: List trade names directory
      responses:
        "200":
          description: Trade names
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradeName"
    post:
      operationId: createTradeName
      tags: [tradeNames]
      summary: Add a trade name to the directory (sites edit permission)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTradeNameInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeName"

  /trade-names/{id}:
    delete:
      operationId: deleteTradeName
      tags: [tradeNames]
      summary: Remove a trade name from the directory (sites edit permission)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /delivery-types:
    get:
      operationId: listDeliveryTypes
      tags: [deliveryTypes]
      summary: List delivery types directory
      responses:
        "200":
          description: Delivery types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryTypeEntry"
    post:
      operationId: createDeliveryType
      tags: [deliveryTypes]
      summary: Add a delivery type to the directory (sites edit permission)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeliveryTypeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryTypeEntry"

  /delivery-types/{id}:
    delete:
      operationId: deleteDeliveryType
      tags: [deliveryTypes]
      summary: Remove a delivery type from the directory (sites edit permission)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientInput"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}:
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientInput"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "409":
          description: Client deletion is blocked by related records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteClientConflict"

  /order-summaries/preview:
    post:
      operationId: previewOrderSummary
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderSummaryPeriodInput"
      responses:
        "200":
          description: Eligible orders and all blockers in the inclusive period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSummaryPreview"
        "400":
          description: Invalid period
        "409":
          description: No orders in period
  /order-summaries:
    get:
      operationId: listOrderSummaries
      tags: [Orders]
      parameters:
        - in: query
          name: clientId
          schema: {type: string, format: uuid}
        - in: query
          name: status
          schema: {type: string, enum: [awaiting_payment, paid]}
      responses:
        "200":
          description: Immutable billing summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderSummary"
    post:
      operationId: createOrderSummary
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderSummaryInput"
      responses:
        "201":
          description: Created or idempotently replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSummary"
        "400":
          description: Invalid period or reused requestId with different input
        "409":
          description: Entire period is blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSummaryConflict"
  /order-summaries/{id}:
    get:
      operationId: getOrderSummary
      tags: [Orders]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Immutable summary with source orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSummary"
        "404":
          description: Not found
  /order-summaries/{id}/pay:
    post:
      operationId: payOrderSummary
      tags: [Orders]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Paid summary (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSummary"
        "404":
          description: Not found
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List client orders
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: string
        - name: isPaid
          in: query
          required: false
          schema:
            type: boolean
        - name: plannedMonth
          in: query
          required: false
          description: Effective planned month (YYYY-MM), or "without" for orders without a month. Omit for all.
          schema:
            type: string
            pattern: '^(?:[0-9]{4}-(?:0[1-9]|1[0-2])|without)$'
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a client order with line items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order by id, including shipped progress per line item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Update an order's payment status or note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    delete:
      operationId: deleteOrder
      tags: [orders]
      summary: Delete an order (only if nothing has been shipped)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /orders/{id}/payments:
    get:
      operationId: listOrderPayments
      tags: [orders]
      summary: List payment history for an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderPayment"
    post:
      operationId: createOrderPayment
      tags: [orders]
      summary: Record a payment (advance or additional) against an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderPaymentInput"
      responses:
        "201":
          description: Updated order with recalculated payment totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /shipments:
    get:
      operationId: listShipments
      tags: [shipments]
      summary: List shipments
      parameters:
        - name: orderId
          in: query
          required: false
          schema:
            type: string
        - name: siteId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of shipments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shipment"
    post:
      operationId: createShipment
      tags: [shipments]
      summary: Create a shipment against an unbilled unpaid order; validates remaining quantities and creates "out" stock movements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShipmentInput"
      responses:
        "201":
          description: Created shipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
        "400":
          description: Validation error (quantity exceeds remaining order amount)
        "409":
          description: Source order is already billed or paid and is immutable

  /shipments/{id}:
    get:
      operationId: getShipment
      tags: [shipments]
      summary: Get a shipment by id (used for накладная printing)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
    patch:
      operationId: updateShipment
      tags: [shipments]
      summary: Update a shipment's metadata (note, driver, site, date). Items/quantities are immutable once shipped.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShipmentInput"
      responses:
        "200":
          description: Updated shipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"

  /shipments/{id}/dispatch:
    post:
      operationId: dispatchShipment
      tags: [shipments]
      summary: >
        Передать курьеру: locks the shipment against further edits and makes its
        накладная printable. Cannot be undone via the API.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dispatched shipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
        "400":
          description: Shipment already dispatched

  /shipments/{id}/delete:
    post:
      operationId: deleteShipment
      tags: [shipments]
      summary: >
        Admin-only: mark a shipment as deleted (soft delete) with a mandatory note,
        instead of editing it. Reverses stock via a compensating "in" movement for
        each item. Cannot be undone via the API; create a new shipment instead.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteShipmentInput"
      responses:
        "200":
          description: Deleted (soft) shipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
        "400":
          description: Shipment already marked as deleted
        "403":
          description: Only admins can mark a shipment for deletion

  /dashboard/delivery-summary:
    get:
      operationId: getDeliveryDashboardSummary
      tags: [dashboard]
      summary: Get план-факт delivery statistics for a month
      parameters:
        - name: month
          in: query
          required: false
          description: Format YYYY-MM, defaults to current month
          schema:
            $ref: "#/components/schemas/CalendarMonth"
      responses:
        "200":
          description: Delivery dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDashboardSummary"
        "400":
          description: Invalid month; expected YYYY-MM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get warehouse dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

components:
  schemas:
    ScheduleReviewInput:
      type: object
      required: [month, rows]
      properties:
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        rows:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: "#/components/schemas/ScheduleFileRow"
        fingerprint:
          type: string
        selectedRows:
          type: array
          items:
            type: integer
    ScheduleFileRow:
      type: object
      required: [row, siteName, driverName, plannedDate]
      properties:
        row:
          type: integer
          minimum: 2
        siteName:
          type: string
          maxLength: 500
        driverName:
          type: string
          maxLength: 500
        plannedDate:
          type: [string, "null"]
          description: ISO-дата, null для пустой ячейки; некорректная строка будет отмечена в отчёте
    ScheduleReviewResult:
      type: object
      required: [fingerprint, rows, updated, created]
      properties:
        fingerprint:
          type: string
        updated:
          type: integer
        created:
          type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleReviewRow"
    ScheduleReviewRow:
      type: object
      required: [row, siteName, status, reason, oldDate, newDate, oldDriver, newDriver]
      properties:
        row:
          type: integer
        siteName:
          type: string
        status:
          type: string
          enum: [update, create, unchanged, protected, conflict]
        reason:
          type: string
        oldDate:
          type: [string, "null"]
        newDate:
          type: [string, "null"]
        oldDriver:
          type: string
        newDriver:
          type: string
    InventoryRecordKind:
      type: string
      enum: [equipment, consumables, spare_parts]
    InventoryRecordInput:
      type: object
      additionalProperties: false
      required: [kind, name, quantity, unit, condition, status]
      description: Equipment requires inventoryNumber and quantity exactly 1. Consumables and spare parts require sku. Archived sites cannot be assigned.
      properties:
        kind:
          $ref: "#/components/schemas/InventoryRecordKind"
        name: { type: string, minLength: 1, maxLength: 300 }
        type: { type: [string, "null"], maxLength: 300 }
        model: { type: [string, "null"], maxLength: 300 }
        inventoryNumber: { type: [string, "null"], minLength: 1, maxLength: 100 }
        sku: { type: [string, "null"], minLength: 1, maxLength: 100 }
        quantity: { type: number, minimum: 0, maximum: 1000000000 }
        unit: { type: string, minLength: 1, maxLength: 50 }
        condition: { type: string, minLength: 1, maxLength: 100 }
        status: { type: string, minLength: 1, maxLength: 100 }
        siteId: { type: [string, "null"], format: uuid }
        notes: { type: [string, "null"], maxLength: 10000 }
    InventoryRecordUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 300 }
        type: { type: [string, "null"], maxLength: 300 }
        model: { type: [string, "null"], maxLength: 300 }
        inventoryNumber: { type: [string, "null"], minLength: 1, maxLength: 100 }
        sku: { type: [string, "null"], minLength: 1, maxLength: 100 }
        quantity: { type: number, minimum: 0, maximum: 1000000000 }
        unit: { type: string, minLength: 1, maxLength: 50 }
        condition: { type: string, minLength: 1, maxLength: 100 }
        status: { type: string, minLength: 1, maxLength: 100 }
        siteId: { type: [string, "null"], format: uuid }
        notes: { type: [string, "null"], maxLength: 10000 }
    InventoryRecord:
      type: object
      required: [id, kind, name, type, model, inventoryNumber, sku, quantity, unit, condition, status, siteId, notes]
      properties:
        id: { type: string, format: uuid }
        kind:
          $ref: "#/components/schemas/InventoryRecordKind"
        name: { type: string }
        type: { type: [string, "null"] }
        model: { type: [string, "null"] }
        inventoryNumber: { type: [string, "null"] }
        sku: { type: [string, "null"] }
        quantity: { type: number }
        unit: { type: string }
        condition: { type: string }
        status: { type: string }
        siteId: { type: [string, "null"], format: uuid }
        notes: { type: [string, "null"] }
    InventoryRecordImport:
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/InventoryRecordInput"
    InventoryRecordImportResult:
      type: object
      required: [records, created]
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/InventoryRecord"
        created: { type: integer }
    InventoryRecordRowError:
      type: object
      required: [row, field, error]
      properties:
        row: { type: integer, minimum: 1, description: One-based row index }
        field: { type: string }
        error: { type: string }
    InventoryRecordImportError:
      type: object
      required: [error, errors]
      properties:
        error: { type: string }
        errors:
          type: array
          items:
            $ref: "#/components/schemas/InventoryRecordRowError"
    CalendarMonth:
      type: string
      minLength: 7
      maxLength: 7
      pattern: '^[1-9]\d{3}-(0[1-9]|1[0-2])$'
      description: Календарный месяц YYYY-MM, год 1000–9999, месяц 01–12
    UserImpersonationTicket:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          description: Short-lived, one-time Clerk ticket

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, name, createdAt]

    CreateCategoryInput:
      type: object
      properties:
        name:
          type: string
      required: [name]

    UpdateCategoryInput:
      type: object
      properties:
        name:
          type: string
      required: [name]

    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        sku:
          type: string
        unit:
          type: string
          description: Unit of measure, e.g. шт, кг, л
        purchasePrice:
          type: number
          description: Закупочная цена
        price:
          type: number
          description: Продажная цена
        categoryId:
          type: string
          nullable: true
        categoryName:
          type: string
          nullable: true
        currentStock:
          type: number
        minStock:
          type: number
          description: Minimum stock threshold for low-stock alerts
        supplier:
          type: string
          nullable: true
          description: Поставщик
        supplierContact:
          type: string
          nullable: true
          description: Контакт поставщика
        isLowStock:
          type: boolean
          description: currentStock < 30% of minStock
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - sku
        - unit
        - purchasePrice
        - price
        - currentStock
        - minStock
        - supplier
        - supplierContact
        - isLowStock
        - createdAt

    CreateProductInput:
      type: object
      properties:
        name:
          type: string
        sku:
          type: string
        unit:
          type: string
        purchasePrice:
          type: number
        price:
          type: number
        categoryId:
          type: string
          nullable: true
        minStock:
          type: number
        supplier:
          type: string
          nullable: true
        supplierContact:
          type: string
          nullable: true
        initialStock:
          type: number
      required: [name, sku, unit, price]

    GoodsReceiptItemInput:
      type: object
      properties:
        productId:
          type: string
          nullable: true
          description: Existing product to receive stock against. Omit to create a brand-new product.
        name:
          type: string
        sku:
          type: string
          nullable: true
          description: Auto-generated if omitted or if a price-variant card needs to be created.
        unit:
          type: string
        purchasePrice:
          type: number
        price:
          type: number
        categoryId:
          type: string
          nullable: true
        minStock:
          type: number
        supplier:
          type: string
          nullable: true
        supplierContact:
          type: string
          nullable: true
        quantity:
          type: number
          exclusiveMinimum: 0
      required: [name, unit, price, quantity]

    GoodsReceiptItem:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        productName:
          type: string
        productUnit:
          type: string
        quantity:
          type: number
        price:
          type: number
        createdNewProductCard:
          type: boolean
          description: True if a new price-variant (or brand-new) product card was created for this item.
      required:
        - id
        - productId
        - productName
        - productUnit
        - quantity
        - price
        - createdNewProductCard

    GoodsReceipt:
      type: object
      properties:
        id:
          type: string
        docNumber:
          type: string
          description: Номер документа поставщика
        docType:
          type: string
          description: Вид документа (накладная, УПД, счёт-фактура и т.п.)
        totalSum:
          type: number
          description: Сумма по документу поставщика
        note:
          type: string
          nullable: true
        isPosted:
          type: boolean
          description: Документ проведён (read-only after posting)
        suppliers:
          type: array
          items:
            type: string
          description: Distinct suppliers of the products in this receipt (for filtering)
        items:
          type: array
          items:
            $ref: "#/components/schemas/GoodsReceiptItem"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - docNumber
        - docType
