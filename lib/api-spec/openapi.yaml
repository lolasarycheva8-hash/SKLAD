          application/json:
            schema:
              $ref: "#/components/schemas/CreateShipmentInput"
      responses:
        "201":
          description: Created shipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
        "400":
          description: Validation error (order not paid or quantity exceeds remaining order amount)

  /shipments/{id}:
    get:
      operationId: getShipment
      tags: [shipments]
      summary: Get a shipment by id (used for накладная printing)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
    patch:
      operationId: updateShipment
      tags: [shipments]
      summary: Update a shipment's metadata (note, driver, site, date). Items/quantities are immutable once shipped.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShipmentInput"
      responses:
        "200":
          description: Updated shipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"

  /shipments/{id}/dispatch:
    post:
      operationId: dispatchShipment
      tags: [shipments]
      summary: >
        Передать курьеру: locks the shipment against further edits and makes its
        накладная printable. Cannot be undone via the API.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dispatched shipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
        "400":
          description: Shipment already dispatched

  /shipments/{id}/delete:
    post:
      operationId: deleteShipment
      tags: [shipments]
      summary: >
        Admin-only: mark a shipment as deleted (soft delete) with a mandatory note,
        instead of editing it. Reverses stock via a compensating "in" movement for
        each item. Cannot be undone via the API; create a new shipment instead.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteShipmentInput"
      responses:
        "200":
          description: Deleted (soft) shipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
        "400":
          description: Shipment already marked as deleted
        "403":
          description: Only admins can mark a shipment for deletion

  /dashboard/delivery-summary:
    get:
      operationId: getDeliveryDashboardSummary
      tags: [dashboard]
      summary: Get план-факт delivery statistics for a month
      parameters:
        - name: month
          in: query
          required: false
          description: Format YYYY-MM, defaults to current month
          schema:
            type: string
      responses:
        "200":
          description: Delivery dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDashboardSummary"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get warehouse dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

components:
  schemas:
    UserImpersonationTicket:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          description: Short-lived, one-time Clerk ticket

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, name, createdAt]

    CreateCategoryInput:
      type: object
      properties:
        name:
          type: string
      required: [name]

    UpdateCategoryInput:
      type: object
      properties:
        name:
          type: string
      required: [name]

    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        sku:
          type: string
        unit:
          type: string
          description: Unit of measure, e.g. шт, кг, л
        purchasePrice:
          type: number
          description: Закупочная цена
        price:
          type: number
          description: Продажная цена
        categoryId:
          type: string
          nullable: true
        categoryName:
          type: string
          nullable: true
        currentStock:
          type: number
        minStock:
          type: number
          description: Minimum stock threshold for low-stock alerts
        supplier:
          type: string
          nullable: true
          description: Поставщик
        supplierContact:
          type: string
          nullable: true
          description: Контакт поставщика
        isLowStock:
          type: boolean
          description: currentStock < 30% of minStock
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - sku
        - unit
        - purchasePrice
        - price
        - currentStock
        - minStock
        - supplier
        - supplierContact
        - isLowStock
        - createdAt

    CreateProductInput:
      type: object
      properties:
        name:
          type: string
        sku:
          type: string
        unit:
          type: string
        purchasePrice:
          type: number
        price:
          type: number
        categoryId:
          type: string
          nullable: true
        minStock:
          type: number
        supplier:
          type: string
          nullable: true
        supplierContact:
          type: string
          nullable: true
        initialStock:
          type: number
      required: [name, sku, unit, price]

    GoodsReceiptItemInput:
      type: object
      properties:
        productId:
          type: string
          nullable: true
          description: Existing product to receive stock against. Omit to create a brand-new product.
        name:
          type: string
        sku:
          type: string
          nullable: true
          description: Auto-generated if omitted or if a price-variant card needs to be created.
        unit:
          type: string
        purchasePrice:
          type: number
        price:
          type: number
        categoryId:
          type: string
          nullable: true
        minStock:
          type: number
        supplier:
          type: string
          nullable: true
        supplierContact:
          type: string
          nullable: true
        quantity:
          type: number
          exclusiveMinimum: 0
      required: [name, unit, price, quantity]

    GoodsReceiptItem:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        productName:
          type: string
        productUnit:
          type: string
        quantity:
          type: number
        price:
          type: number
        createdNewProductCard:
          type: boolean
          description: True if a new price-variant (or brand-new) product card was created for this item.
      required:
        - id
        - productId
        - productName
        - productUnit
        - quantity
        - price
        - createdNewProductCard

    GoodsReceipt:
      type: object
      properties:
        id:
          type: string
        docNumber:
          type: string
          description: Номер документа поставщика
        docType:
          type: string
          description: Вид документа (накладная, УПД, счёт-фактура и т.п.)
        totalSum:
          type: number
          description: Сумма по документу поставщика
        note:
          type: string
          nullable: true
        isPosted:
          type: boolean
          description: Документ проведён (read-only after posting)
        suppliers:
          type: array
          items:
            type: string
          description: Distinct suppliers of the products in this receipt (for filtering)
        items:
          type: array
          items:
            $ref: "#/components/schemas/GoodsReceiptItem"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - docNumber
        - docType
        - totalSum
        - note
        - isPosted
        - suppliers
        - items
        - createdAt

    CreateGoodsReceiptInput:
      type: object
      properties:
        docNumber:
          type: string
        docType:
          type: string
        totalSum:
          type: number
        note:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/GoodsReceiptItemInput"
          minItems: 1
      required: [docNumber, docType, totalSum, items]

    UpdateGoodsReceiptInput:
      type: object
      properties:
        docNumber:
          type: string
        docType:
          type: string
        note:
          type: string
          nullable: true
        items:
          type: array
          description: >
            Full list of remaining items with (possibly updated) quantities. Items of the
            document missing from this list are removed. New items cannot be added here.
          items:
            type: object
            properties:
              id:
                type: string
                description: Existing goods_receipt_items id
              quantity:
                type: number
                exclusiveMinimum: 0
            required: [id, quantity]

    CreateProductsBulkInput:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreateProductInput"
      required: [items]

    UpdateProductInput:
      type: object
      properties:
        name:
          type: string
        sku:
          type: string
        unit:
          type: string
        purchasePrice:
          type: number
        price:
          type: number
        categoryId:
          type: string
          nullable: true
        minStock:
          type: number
        supplier:
          type: string
          nullable: true
        supplierContact:
          type: string
          nullable: true

    Site:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: Unique site name
        address:
          type: string
        branch:
          type: string
          description: Куст
        customer:
          type: string
          description: Торговое название объекта (необязательно; непустое значение строго из справочника trade_names)
        client:
          type: string
          description: Отображаемое название клиента, сохранённое вместе с объектом
        clientId:
          type: string
          format: uuid
          description: Стабильная обязательная связь с клиентом
        manager:
          type: string
          description: Закреплённый менеджер
        managerContact:
          type: string
          description: Контакт менеджера
        director:
          type: string
          description: Закреплённый руководитель
        project:
          type: string
          description: Закреплённый проект
        driverUserId:
          type: [string, "null"]
          format: uuid
          description: UUID закреплённого пользователя-водителя
        driver:
          type: string
          description: Отображаемое имя водителя или «Не назначен»
        deliveryType:
          type: string
          description: Тип поставки (из справочника delivery_types; может быть пустым)
        features:
          type: string
          description: Особенности работы объекта или подъезда большой машины
        closedFrom:
          type: string
          format: date
          nullable: true
          description: Дата, с которой объект закрыт (null — объект работает)
        reopenDate:
          type: string
          format: date
          nullable: true
          description: Планируемая дата открытия (если известна)
        closureReason:
          type: string
          nullable: true
        closedBy:
          type: string
          nullable: true
        isClosed:
          type: boolean
          description: Закрыт ли объект на текущую дату (учитывает closedFrom/reopenDate)
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - address
        - branch
        - customer
        - client
        - clientId
        - manager
        - managerContact
        - director
        - project
        - driverUserId
        - driver
        - deliveryType
        - features
        - closedFrom
        - reopenDate
        - closureReason
        - closedBy
        - isClosed
        - createdAt

    SiteBranchLookup:
      type: object
      properties:
        name:
          type: string
      required: [name]

    DeleteClientConflict:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          enum: [CLIENT_HAS_SITES, CLIENT_HAS_ORDERS]
        blockingSites:
          type: object
          properties:
            count:
              type: integer
              minimum: 1
            preview:
              type: array
              maxItems: 3
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                required: [id, name]
          required: [count, preview]
      required: [error, code]

    SiteWriteInputBase:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        branch:
          type: string
        clientId:
          type: string
          format: uuid
        manager:
          type: string
        managerContact:
          type: string
        director:
          type: string
        project:
          type: string
        driverUserId:
          type: [string, "null"]
          format: uuid
        deliveryType:
          type: string
        features:
          type: string
      required:
        - name
        - address
        - branch
        - clientId
        - manager
        - director
        - project

    CreateSiteInput:
      allOf:
        - $ref: "#/components/schemas/SiteWriteInputBase"
        - type: object
          properties:
            customer:
              type: string
              minLength: 1
              pattern: '.*\S.*'
              description: Обязательное непустое торговое название объекта из справочника
          required: [customer]

    BulkSiteInput:
      allOf:
        - $ref: "#/components/schemas/SiteWriteInputBase"
        - type: object
          properties:
            customer:
              type: string
              description: Необязательное торговое название объекта
            id:
              type: string
              format: uuid

    UpdateSiteInput:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        branch:
          type: string
        customer:
          type: string
        clientId:
          type: string
          format: uuid
        manager:
          type: string
        managerContact:
          type: string
        director:
          type: string
        project:
          type: string
        driverUserId:
          type: [string, "null"]
          format: uuid
        deliveryType:
          type: string
        features:
          type: string
      minProperties: 1
      required:
        - clientId

    UpdateSiteFeaturesInput:
      type: object
      additionalProperties: false
      properties:
        features:
          type: string
      required:
        - features

    SiteChangeProposal:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
        address:
          type: string
        branch:
          type: string
        customer:
          type: string
        clientId:
          type: string
          format: uuid
        manager:
          type: string
        managerContact:
          type: string
        director:
          type: string
        project:
          type: string
        driverUserId:
          type: [string, "null"]
          format: uuid
        deliveryType:
          type: string

    SiteChangeRequestStatus:
      type: string
      enum: [pending, approved, rejected]

    SiteChangeRequest:
      type: object
      required:
        - id
        - siteId
        - siteName
        - authorUserId
        - authorName
        - authorEmail
        - payload
        - originalPayload
        - status
        - createdAt
        - decidedAt
        - decidedByUserId
        - decidedByName
        - decidedByEmail
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: [string, "null"]
          format: uuid
        siteName:
          type: string
        authorUserId:
          type: [string, "null"]
          format: uuid
        authorName:
          type: string
        authorEmail:
          type: string
        payload:
          $ref: "#/components/schemas/SiteChangeProposal"
        originalPayload:
          $ref: "#/components/schemas/SiteChangeProposal"
        status:
          $ref: "#/components/schemas/SiteChangeRequestStatus"
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: [string, "null"]
          format: date-time
        decidedByUserId:
          type: [string, "null"]
          format: uuid
        decidedByName:
          type: [string, "null"]
        decidedByEmail:
          type: [string, "null"]

    DeliveryStatus:
      type: string
      description: |
        pending — план в будущем, факта нет; on_time — доставлено в срок или раньше;
        late — доставлено позже плана; overdue — план уже прошёл, факта нет
      enum: [pending, on_time, late, overdue]

    DeliveryWorkflowStatus:
      type: string
      description: planned — not completed; done — actual date set but act unapproved; closed — act approved
      enum: [planned, done, closed]

    Delivery:
      type: object
      properties:
        id:
          type: string
        siteId:
          type: string
        siteName:
          type: string
        siteAddress:
          type: string
        managerContact:
          type: [string, "null"]
          description: Телефон менеджера объекта для связи с водителем
        driverUserId:
          type: [string, "null"]
          format: uuid
        driver:
          type: string
        plannedDate:
          type: [string, "null"]
          format: date
          description: Плановая дата доставки (null, если дата ещё не назначена)
        correctedPlannedDate:
          type: [string, "null"]
          format: date
          description: Уточнённая плановая дата только для отчётности; не изменяет исходный план, график или показатели
        deliveryType:
          type: [string, "null"]
          description: Тип поставки для этой доставки; null означает использовать значение объекта
        scheduleMonth:
          type: [string, "null"]
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: Месяц владения строкой графика; null возможен только у legacy rows
        actualDate:
          type: string
          format: date
          nullable: true
          description: Фактическая дата доставки (редактируемая)
        actApprovedAt:
          type: [string, "null"]
          format: date-time
        actApprovedBy:
          type: [string, "null"]
          format: uuid
        workflowStatus:
          $ref: "#/components/schemas/DeliveryWorkflowStatus"
        note:
          type: string
          nullable: true
          description: Комментарий водителя; логист видит его только для чтения
        logisticianNote:
          type: string
          nullable: true
          description: Примечание логиста для водителя; водитель видит его только для чтения
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        lagDays:
          type: integer
          description: Отклонение факта от плана в днях (положительное — отставание)
          nullable: true
        rescheduledFromDate:
          type: string
          format: date
          nullable: true
          description: Исходная плановая дата до переноса (null — переносов не было)
        rescheduledBy:
          type: string
          nullable: true
        rescheduledAt:
          type: string
          format: date-time
          nullable: true
        photosCount:
          type: integer
          description: Количество приложенных фото-актов
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - siteId
        - siteName
        - siteAddress
        - driverUserId
        - driver
        - plannedDate
        - scheduleMonth
        - actualDate
        - actApprovedAt
        - actApprovedBy
        - workflowStatus
        - note
        - logisticianNote
        - status
        - lagDays
        - rescheduledFromDate
        - rescheduledBy
        - rescheduledAt
        - photosCount
        - createdAt

    CreateDeliveryInput:
      type: object
      properties:
        siteId:
          type: string
        driverUserId:
          type: [string, "null"]
          format: uuid
        plannedDate:
          type: [string, "null"]
          format: date
        correctedPlannedDate:
          type: [string, "null"]
          format: date
          description: Уточнённая плановая дата только для отчётности
        actualDate:
          type: [string, "null"]
          format: date
        deliveryType:
          type: [string, "null"]
          description: Тип поставки для этой доставки; null означает использовать значение объекта
        scheduleMonth:
          type: [string, "null"]
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      required: [siteId]

    CreateDeliveriesBulkInput:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreateDeliveryInput"
      required: [items]

    ReplaceDeliveriesBulkInput:
      type: object
      properties:
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreateDeliveryInput"
      required: [month, items]

    DeliveryActualInput:
      type: object
      properties:
        id:
          type: string
        actualDate:
          type: string
          format: date
      required: [id, actualDate]

    UpdateDeliveriesActualBulkInput:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryActualInput"
      required: [items]

    UpdateDeliveriesActualBulkResult:
      type: object
      properties:
        updated:
          type: integer
          minimum: 0
      required: [updated]

    UpdateDeliveryInput:
      type: object
      additionalProperties: false
      properties:
        plannedDate:
          type: [string, "null"]
          format: date
        correctedPlannedDate:
          type: [string, "null"]
          format: date
          description: Уточнённая плановая дата только для отчётности; null очищает значение
        actualDate:
          type: string
          format: date
          nullable: true
        logisticianNote:
          type: string
          nullable: true
          description: Примечание для водителя; изменять может только логист
        driverUserId:
          type: [string, "null"]
          format: uuid
          description: Замена водителя на эту конкретную доставку (не меняет привязку объекта)

    DeliveryCommentUpdate:
      type: object
      additionalProperties: false
      properties:
        note:
          type: [string, "null"]
      required: [note]

    DriverPlanFactStat:
      type: object
      properties:
        driver:
          type: string
        total:
          type: integer
        onTime:
          type: integer
        planFactPercent:
          type: number
      required: [driver, total, onTime, planFactPercent]

    DeliveryDashboardSummary:
      type: object
      properties:
        month:
          type: string
        totalScheduled:
          type: integer
        undatedCount:
          type: integer
          description: Количество доставок без назначенной даты в выбранном месяце
        dueCount:
          type: integer
          description: Доставки, плановая дата которых уже наступила
        onTimeCount:
          type: integer
        lateCount:
          type: integer
        overdueCount:
          type: integer
        planFactPercent:
          type: number
        avgLagDays:
          type: number
        planFactByDriver:
          type: array
          items:
            $ref: "#/components/schemas/DriverPlanFactStat"
        overdueDeliveries:
          type: array
          items:
            $ref: "#/components/schemas/Delivery"
        todayTotal:
          type: integer
          description: Количество доставок, запланированных на сегодня
        todayByDriver:
          type: array
          items:
            $ref: "#/components/schemas/DriverCount"
        todayDeliveries:
          type: array
          description: Все доставки, запланированные на сегодня
          items:
            $ref: "#/components/schemas/Delivery"
      required:
