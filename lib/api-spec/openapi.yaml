openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product catalog operations
  - name: categories
    description: Category operations
  - name: goods-receipts
    description: Goods receipt documents (поступление товара)
  - name: dashboard
    description: Dashboard summary operations
  - name: sites
    description: Serviced sites (objects) directory
  - name: deliveries
    description: Delivery schedule operations (график развоза, план/факт)
  - name: clients
    description: Client directory operations
  - name: orders
    description: Client order operations (заказы клиентов)
  - name: shipments
    description: Shipment operations (отгрузки, накладные)
  - name: users
    description: App user role/permission management
paths:
  /deliveries/schedule-review:
    post:
      operationId: reviewDeliverySchedule
      tags: [deliveries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleReviewInput"
      responses:
        "200":
          description: Предпросмотр или результат безопасного обновления
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleReviewResult"
        "409":
          description: График изменился; повторите предпросмотр
  /inventory-records:
    get:
      operationId: listInventoryRecords
      tags: [inventory]
      summary: List inventory records (admin only)
      parameters:
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/InventoryRecordKind"
        - name: siteId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Inventory records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryRecord"
        "403":
          description: Administrator required
    post:
      operationId: createInventoryRecord
      tags: [inventory]
      summary: Create an inventory record (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryRecordInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryRecord"
        "400":
          description: Invalid record or archived/missing site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator required
  /inventory-records/bulk:
    post:
      operationId: bulkCreateInventoryRecords
      tags: [inventory]
      summary: Atomically create inventory records without overwriting (admin only)
      description: Equipment identifiers are globally unique; SKU is unique per kind. Identifiers are trimmed and compared case-insensitively. Any invalid or duplicate row rejects the entire batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryRecordImport"
      responses:
        "201":
          description: All rows created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryRecordImportResult"
        "400":
          description: Invalid rows; nothing committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryRecordImportError"
        "409":
          description: Duplicate rows; nothing committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryRecordImportError"
        "403":
          description: Administrator required
  /inventory-records/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateInventoryRecord
      tags: [inventory]
      summary: Update inventory record; kind is immutable (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryRecordUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryRecord"
        "400":
          description: Invalid record or site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Record not found
        "409":
          description: Duplicate identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator required
    delete:
      operationId: deleteInventoryRecord
      tags: [inventory]
      summary: Delete inventory record (admin only)
      responses:
        "204":
          description: Deleted
        "400":
          description: Invalid identifier
        "404":
          description: Record not found
        "403":
          description: Administrator required
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Rename a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryInput"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products with current stock
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
        - name: lowStockOnly
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/bulk:
    post:
      operationId: createProductsBulk
      tags: [products]
      summary: Atomic product import, match by SKU or unambiguous name when SKU is blank
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductsBulkInput"
      responses:
        "201":
          description: Created/updated products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImportResult"
        "400":
          description: Invalid or duplicate rows; nothing saved
        "409":
          description: Ambiguous existing products; nothing saved

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductInput"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /goods-receipts:
    get:
      operationId: listGoodsReceipts
      tags: [goods-receipts]
      summary: List goods receipt documents (история поступлений товара)
      responses:
        "200":
          description: List of goods receipts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoodsReceipt"
    post:
      operationId: createGoodsReceipt
      tags: [goods-receipts]
      summary: >
        Register a "Поступление товара" document with a supplier document number, type, total sum,
        and a list of received items. For each item, adds stock to an existing product, creates a
        new product, or creates a new price-variant card if the sale price changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoodsReceiptInput"
      responses:
        "201":
          description: Created goods receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoodsReceipt"

  /goods-receipts/{id}:
    get:
      operationId: getGoodsReceipt
      tags: [goods-receipts]
      summary: Get a goods receipt document by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Goods receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoodsReceipt"
    patch:
      operationId: updateGoodsReceipt
      tags: [goods-receipts]
      summary: >
        Update a draft (not posted) goods receipt: header fields (docNumber, docType, note)
        and item quantities, or remove items. Rejected with 400 if the document is posted.
        Item quantity changes and removals are synced to the movements ledger.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoodsReceiptInput"
      responses:
        "200":
          description: Updated goods receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoodsReceipt"
    delete:
      operationId: deleteGoodsReceipt
      tags: [goods-receipts]
      summary: >
        Delete a goods receipt document (admin only). Removes the document, its items,
        and all linked "in" movements, so the received stock is reversed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /goods-receipts/{id}/post:
    post:
      operationId: postGoodsReceipt
      tags: [goods-receipts]
      summary: >
        Провести документ поступления. After posting, the document becomes read-only
        (no edits allowed); only an admin can delete it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Posted goods receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoodsReceipt"

  /sites:
    get:
      operationId: listSites
      tags: [sites]
      summary: List all serviced sites
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Site"
    post:
      operationId: createSite
      tags: [sites]
      summary: Create a serviced site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSiteInput"
      responses:
        "201":
          description: Created site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"

  /sites/bulk:
    post:
      operationId: createSitesBulk
      tags: [sites]
      summary: Create multiple sites at once (импорт из Excel), upsert by name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSitesBulkInput"
      responses:
        "201":
          description: Created/updated sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Site"

  /site-change-requests:
    get:
      operationId: listSiteChangeRequests
      tags: [sites]
      summary: Список предложений правок объектов (только администратор)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SiteChangeRequestStatus"
      responses:
        "200":
          description: Предложения правок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteChangeRequest"

  /sites/{id}/change-requests:
    post:
      operationId: createSiteChangeRequest
      tags: [sites]
      summary: Предложить правки объекта (логист с доступом к разделу Объекты)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteChangeProposal"
      responses:
        "201":
          description: Предложение создано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteChangeRequest"

  /sites/{id}/features:
    patch:
      operationId: updateSiteFeatures
      tags: [sites]
      summary: Изменить особенности объекта
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSiteFeaturesInput"
      responses:
        "200":
          description: Особенности объекта обновлены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"

  /site-change-requests/{id}/approve:
    post:
      operationId: approveSiteChangeRequest
      tags: [sites]
      summary: Принять предложение правок (только администратор)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Предложение принято
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteChangeRequest"
        "409":
          description: Предложение уже обработано

  /site-change-requests/{id}/reject:
    post:
      operationId: rejectSiteChangeRequest
      tags: [sites]
      summary: Отклонить предложение правок (только администратор)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Предложение отклонено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteChangeRequest"
        "409":
          description: Предложение уже обработано

  /sites/{id}:
    get:
      operationId: getSite
      tags: [sites]
      summary: Get a site by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
    patch:
      operationId: updateSite
      tags: [sites]
      summary: Update a serviced site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSiteInput"
      responses:
        "200":
          description: Updated site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
    delete:
      operationId: deleteSite
      tags: [sites]
      summary: Delete a serviced site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /deliveries:
    get:
      operationId: listDeliveries
      tags: [deliveries]
      summary: List delivery schedule entries
      parameters:
        - name: month
          in: query
          required: false
          description: Filter by month, format YYYY-MM
          schema:
            $ref: "#/components/schemas/CalendarMonth"
        - name: dateFrom
          in: query
          required: false
          description: Filter deliveries with plannedDate >= dateFrom (valid calendar date YYYY-MM-DD). Takes precedence over month when provided.
          schema:
            type: string
            minLength: 10
            maxLength: 10
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
        - name: dateTo
          in: query
          required: false
          description: Filter deliveries with plannedDate <= dateTo (valid calendar date YYYY-MM-DD). Takes precedence over month when provided.
          schema:
            type: string
            minLength: 10
            maxLength: 10
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
        - name: siteId
          in: query
          required: false
          schema:
            type: string
        - name: driverUserId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DeliveryStatus"
        - name: archived
          in: query
          required: false
          description: Return archived deliveries only; restricted to delivery editors
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: List of deliveries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"
        "400":
          description: Invalid month; expected YYYY-MM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createDelivery
      tags: [deliveries]
      summary: Create a planned delivery (график)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeliveryInput"
      responses:
        "201":
          description: Created delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"

  /deliveries/bulk:
    post:
      operationId: createDeliveriesBulk
      tags: [deliveries]
      summary: Create multiple planned deliveries at once (генерация графика на месяц)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeliveriesBulkInput"
      responses:
        "201":
          description: Created deliveries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"

  /deliveries/acts/download:
    get:
      operationId: downloadDeliveryActsForPeriod
      tags: [deliveries]
      summary: Скачать ZIP актов доставок за диапазон фактических дат
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: ZIP archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid date range
        "403":
          description: Forbidden
        "404":
          description: No acts found
        "413":
          description: Too many act files

  /deliveries/bulk/replace:
    post:
      operationId: replaceDeliveriesBulk
      tags: [deliveries]
      summary: Replace all deliveries for a selected month
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceDeliveriesBulkInput"
      responses:
        "201":
          description: Replaced deliveries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"

  /deliveries/bulk/actual:
    post:
      operationId: updateDeliveriesActualBulk
      tags: [deliveries]
      summary: Upload actual delivery dates (superadmin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeliveriesActualBulkInput"
      responses:
        "200":
          description: Actual dates updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateDeliveriesActualBulkResult"

  /deliveries/bulk/update:
    post:
      operationId: updateDeliveriesBulk
      tags: [deliveries]
      summary: Atomically update the driver or planned date for an explicit delivery snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeliveriesBulkInput"
      responses:
        "200":
          description: Deliveries updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateDeliveriesBulkResult"
        "400":
          description: Invalid input
        "403":
          description: Insufficient delivery editing permission or site scope
        "409":
          description: The snapshot is stale or at least one delivery cannot be changed

  /deliveries/{id}/additional-order:
    post:
      operationId: createAdditionalDeliveryOrder
      tags: [deliveries]
      summary: Create an independent additional delivery order from an existing delivery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdditionalDeliveryOrderInput"
      responses:
        "200":
          description: Existing result returned for an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdditionalDeliveryOrderResult"
        "201":
          description: Created additional order and delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdditionalDeliveryOrderResult"
        "400":
          description: Invalid input or delivery type
        "404":
          description: Source delivery not found
        "409":
          description: Source delivery is unavailable or requestId conflicts
  /deliveries/{id}:
    patch:
      operationId: updateDelivery
      tags: [deliveries]
      summary: Record actual delivery date (факт), planned date stays immutable
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeliveryInput"
      responses:
        "200":
          description: Updated delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
    delete:
      operationId: deleteDelivery
      tags: [deliveries]
      summary: Delete a delivery schedule entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
